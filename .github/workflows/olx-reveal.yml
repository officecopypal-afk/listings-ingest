name: OLX reveal (Faza 2)
# Czysty fetch (bez przeglądarki). Throttle jest PER-IP (~5/IP) → rotacja proxy IP.
# Numer → leads_ingest_offer → auto-SMS.

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Ile ogłoszeń z kolejki"
        default: "300"
      cap_per_ip:
        description: "Reveali na jedno IP (limit OLX ~5-6, potem kara ~10min)"
        default: "6"
      concurrency:
        description: "Ile workerów równolegle (każdy na swoim IP)"
        default: "30"
      proxy_country:
        description: "Kraj proxy (pl/de/fr/...) — świeża pula IP"
        default: "pl"
      proxy_countries:
        description: "Lista krajów do rotacji, np pl,ua,ro,de,gb (pusta = pojedynczy)"
        default: ""
      random_fp:
        description: "1 = losowy x-fingerprint per reveal (test flagowania FP)"
        default: ""
  # cron WYŁĄCZONY (12.07 wieczór) — cały pool IPRoyal rozgrzany hurtem reveali; ostudzenie.
  # Włączyć z powrotem GENTLE (rzadziej, mniejszy MAX) dopiero po potwierdzeniu że throttle opadł.
  # schedule:
  #   - cron: "*/10 * * * *"

concurrency:
  group: olx-reveal
  cancel-in-progress: false

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: reveal
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          OLX_FP: ${{ secrets.OLX_FP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX: ${{ github.event.inputs.max || '300' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '30' }}
          CAP_PER_IP: ${{ github.event.inputs.cap_per_ip || '6' }}
          MAX_IP_TRIES: "4"
          PROXY_COUNTRY: ${{ github.event.inputs.proxy_country || 'pl' }}
          PROXY_COUNTRIES: ${{ github.event.inputs.proxy_countries || '' }}
          RANDOM_FP: ${{ github.event.inputs.random_fp || '' }}
        run: node revealer.mjs
      - name: Slack alert on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          payload=$(printf '{"text":":red_circle: *Bot numerów — FAIL*\\n*%s* padł na cronie\\n<%s|Otwórz log w GitHub Actions>"}' "$WF" "$RUN_URL")
          curl -sS -X POST "$SUPABASE_URL/functions/v1/scraper-alert" -H "authorization: Bearer $SRK" -H 'content-type: application/json' -d "$payload" || true
