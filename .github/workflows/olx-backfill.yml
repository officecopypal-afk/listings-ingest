name: OLX backfill (jednorazowy, głęboki)
# Jednorazowy głęboki scan wstecz do konkretnej DATY WYSTAWIENia — dobiera zaległość, sprawdza luki.
# Zbiera prywatne z created_time >= SINCE_DATE; stop gdy organiczny last_refresh_time < SINCE_DATE (okno pewnie pełne).
# Nie zdechnie: timeout 120 min + każde ogłoszenie zapisywane od razu (nic nie tracimy jak uciął).
on:
  workflow_dispatch:
    inputs:
      since_date:
        description: "Zbieraj wystawione OD (ISO, strefa PL)"
        default: "2026-07-07T00:01:00+02:00"
      max_pages:
        description: "Sufit stron/zakres (stop na granicy okna albo cap OLX)"
        default: "300"

concurrency:
  group: olx-collect-api          # ten sam co kolektor → nie biją się
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scraper/olx-collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: backfill
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SINCE_DATE: ${{ github.event.inputs.since_date || '2026-07-07T00:01:00+02:00' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '300' }}
        run: node collector_api.mjs
