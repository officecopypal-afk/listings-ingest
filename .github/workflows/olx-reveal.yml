name: OLX reveal (Faza 2)
# Czysty fetch (bez przeglądarki). Throttle jest PER-IP (~5/IP) → rotacja proxy IP.
# Numer → leads_ingest_offer → auto-SMS.

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Ile ogłoszeń z kolejki"
        default: "60"
      cap_per_ip:
        description: "Reveali na jedno IP (rotacja pod limitem ~5-6)"
        default: "5"
      concurrency:
        description: "Ile workerów równolegle (każdy na swoim IP)"
        default: "6"
  schedule:
    - cron: "*/10 * * * *"   # co 10 min — nocny przelot całej bazy; pamięć wypalonych IP omija spalone

concurrency:
  group: olx-reveal
  cancel-in-progress: false

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: reveal
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          OLX_FP: ${{ secrets.OLX_FP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX: ${{ github.event.inputs.max || '60' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
          CAP_PER_IP: ${{ github.event.inputs.cap_per_ip || '5' }}
          MAX_IP_TRIES: "4"
        run: node revealer.mjs
      - name: Slack alert on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          payload=$(printf '{"text":":red_circle: *Bot numerów — FAIL*\\n*%s* padł na cronie\\n<%s|Otwórz log w GitHub Actions>"}' "$WF" "$RUN_URL")
          curl -sS -X POST "$SUPABASE_URL/functions/v1/scraper-alert" -H "authorization: Bearer $SRK" -H 'content-type: application/json' -d "$payload" || true
