name: probe per-IP
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: scraper/olx-reveal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          OLX_FP: ${{ secrets.OLX_FP }}
        run: node probe_perip.mjs
