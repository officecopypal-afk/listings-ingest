name: OLX browser reveal (Track 2)
# Silnik rotacyjny: konta w kółko, 5/konto, cooldown 8min per konto. Reveal przez przeglądarkę na sesji.
on:
  workflow_dispatch:
    inputs:
      per_account:
        description: "Ile reveali na konto przed rotacją (limit ~5 przed captchą)"
        default: "5"
      budget_min:
        description: "Budżet czasu w minutach (test: 4, produkcja: 300)"
        default: "300"
      cooldown_min:
        description: "Cooldown per konto (min)"
        default: "8"
jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install patchright --no-audit --no-fund
      - run: npx patchright install --with-deps chromium
      - name: browser reveal
        env:
          OLX_SESSION: ${{ secrets.OLX_SESSION }}
          OLX_SESSIONS: ${{ secrets.OLX_SESSIONS }}
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PER_ACCOUNT: ${{ github.event.inputs.per_account || '5' }}
          COOLDOWN_MIN: ${{ github.event.inputs.cooldown_min || '8' }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '300' }}
          DEBUG: "1"
        run: node browser_revealer.mjs
