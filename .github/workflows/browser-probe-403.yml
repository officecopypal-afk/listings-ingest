name: OLX proba 403 (przeglądarka vs skrypt)
# Jednorazowa diagnostyka blokady z 31.07.2026. Ten sam runner, ten sam adres —
# jedyna zmienna to klient (prawdziwy chromium vs zwykły fetch).
# Nie dotyka kont, tokenów ani bazy. Nic nie zapisuje.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper/olx-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install patchright --no-audit --no-fund
      - run: npx patchright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: proba
        run: xvfb-run -a node browser_probe.mjs
