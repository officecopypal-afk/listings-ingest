name: country reveal test
on:
  workflow_dispatch:
jobs:
  ctest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: country test
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
        run: node countrytest.mjs
