name: OLX MOBILE reveal
# Silnik mobilny: czysty HTTP przez residential proxy (per konto), bez przeglądarki/captchy.
# Ciągłość = self-chain; backstop = cron godzinny; DEDUP = lock w Supabase (tylko 1 run pracuje, reszta wychodzi w sekundę).
on:
  schedule:
    - cron: "*/15 * * * *"  # co 15 min: launcher (gdy flaga ON) + szybki restart/wskrzeszenie z panelu. Gdy OFF run wychodzi od razu.
  workflow_dispatch:
    inputs:
      per_account:
        description: "Reveali/konto na cykl"
        default: "25"
      pause_min:
        description: "Pauza po sekwencji (min)"
        default: "7"
      budget_min:
        description: "Budżet minut runu (potem self-chain)"
        default: "330"
permissions:
  actions: write   # do samo-wywołania następnego runu (łańcuch)
  contents: read

# TWARDA BRAMKA: tylko 1 run tego workflowa naraz + max 1 w kolejce.
# Ucina runaway self-chaina — lock-held exity nie mnożą już runów, bo GitHub sam
# odmawia startu kolejnego gdy jeden jest in_progress (a nadmiarowe pending zastępuje najnowszym).
concurrency:
  group: olx-mobile-reveal
  cancel-in-progress: false
jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scraper/olx-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install undici --no-audit --no-fund
      - name: mobile reveal engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PER_ACCOUNT: ${{ github.event.inputs.per_account || '25' }}
          PAUSE_MIN: ${{ github.event.inputs.pause_min || '7' }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '330' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
        run: node mobile_engine.mjs
      - name: łańcuch — następny run (tylko gdy reveal WŁĄCZONY flagą)
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EN=$(curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/leads_reveal_control_get" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "content-type: application/json" -d '{}')
          if [ "$EN" = "true" ]; then
            gh workflow run "OLX MOBILE reveal" --ref "${{ github.ref_name }}"
          else
            echo "reveal WYŁĄCZONY (flaga) — nie łańcuchuję"
          fi
